[package]
name = "city_zed"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/city_zed.rs"
doctest = false

[dependencies]
gpui.workspace = true
workspace.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
city_model = { git = "https://github.com/HubDev-AI/eof", rev = "c3deaf86248543a60cb7113d1da94957c2b7c673" }
city_shell = { git = "https://github.com/HubDev-AI/eof", rev = "c3deaf86248543a60cb7113d1da94957c2b7c673" }
city_settings = { git = "https://github.com/HubDev-AI/eof", rev = "c3deaf86248543a60cb7113d1da94957c2b7c673" }
clock.workspace = true
fs.workspace = true
futures.workspace = true
gpui_apple = { workspace = true, features = ["font-kit"] }
language.workspace = true
log.workspace = true
paths.workspace = true
project.workspace = true
serde_json.workspace = true
settings.workspace = true
settings_json = { workspace = true, features = ["editing"] }
util.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
city_settings = { git = "https://github.com/HubDev-AI/eof", rev = "c3deaf86248543a60cb7113d1da94957c2b7c673", features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
settings = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
workspace = { workspace = true, features = ["test-support"] }
