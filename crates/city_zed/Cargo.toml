[package]
name = "city_zed"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/city_zed.rs"
doctest = false

[dependencies]
gpui.workspace = true
workspace.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
city_model = { git = "https://github.com/HubDev-AI/eof", rev = "d4bd3b0f701eafaa165901269a1995072588e74c" }
city_shell = { git = "https://github.com/HubDev-AI/eof", rev = "d4bd3b0f701eafaa165901269a1995072588e74c" }
clock.workspace = true
futures.workspace = true
gpui_apple = { workspace = true, features = ["font-kit"] }
language.workspace = true
log.workspace = true
project.workspace = true
util.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
settings = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
workspace = { workspace = true, features = ["test-support"] }
